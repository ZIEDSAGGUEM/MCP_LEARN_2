events {}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS: follow pods when they restart

  upstream campushub {
    zone campushub 64k;
    server campushub:3000 resolve;           # every replica, round-robin
  }

  log_format mcp '$server_port "$request" $status method=$http_mcp_method name=$http_mcp_name upstream=$upstream_addr cache=$upstream_cache_status';
  access_log /dev/stdout mcp;

  proxy_cache_path /tmp/nginx-cache levels=1 keys_zone=campus_lab:1m max_size=10m inactive=10m;

  # ---------- Public entrance: localhost:4100 (no cache) ----------
  server {
    listen 80;
    location /mcp {
      proxy_pass http://campushub;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;                   # streams (step 06 subscriptions) must flow through
      proxy_read_timeout 300s;
      add_header X-Upstream $upstream_addr always;
    }
    location /.well-known/ { proxy_pass http://campushub; proxy_set_header Host $host; }
    location /healthz      { proxy_pass http://campushub; proxy_set_header Host $host; }
  }

  # ---------- LAB: a shared cache that obeys Cache-Control: localhost:4103 ----------
  # Keyed by the routing headers (Mcp-Method + Mcp-Name; for resources/read, Mcp-Name is the URI),
  # NOT by user. That's how a CDN in front of an API behaves. X-Lab-Run only isolates test runs.
  server {
    listen 82;
    location /mcp {
      proxy_pass http://campushub;
      proxy_set_header Host $host;
      proxy_cache campus_lab;
      proxy_cache_methods POST;
      proxy_cache_key "$server_port|$http_mcp_method|$http_mcp_name|$http_x_lab_run";
      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Upstream $upstream_addr always;
    }
  }

  # ---------- LAB: a BROKEN cache that ignores Cache-Control: localhost:4104 ----------
  # The "cache everything" CDN rule. Shows attack C3 happening.
  server {
    listen 83;
    location /mcp {
      proxy_pass http://campushub;
      proxy_set_header Host $host;
      proxy_cache campus_lab;
      proxy_cache_methods POST;
      proxy_cache_key "$server_port|$http_mcp_method|$http_mcp_name|$http_x_lab_run";
      proxy_cache_valid 200 60s;
      proxy_ignore_headers Cache-Control Expires Vary Set-Cookie;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
