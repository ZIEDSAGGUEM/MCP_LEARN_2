# CampusHub local lab (step 00).
# Every port listens on 127.0.0.1 only, on ports that don't clash with InsureBot.
# Every image is pinned to a version AND a digest. Secrets come from .env (created by scripts/setup.sh).

name: campushub

services:
  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
      POSTGRES_DB: campus
      CAMPUS_APP_PASSWORD: ${CAMPUS_APP_PASSWORD:?run scripts/setup.sh} # read by db/001_roles.sh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro # runs once, on an empty database
    ports: ["127.0.0.1:5434:5432"] # 5432 and 5433 are used by other projects
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4.11@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    ports: ["127.0.0.1:6382:6379"] # step 06 (event bus) and 07 (jobs)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/setup.sh}
      KC_HOSTNAME: http://localhost:8090 # one fixed "iss", whether called from the Mac or a container
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes: ["kcdata:/opt/keycloak/data"]
    ports: ["127.0.0.1:8090:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      retries: 40

  minio:
    # S3-compatible file storage: syllabi and assignment submissions
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run scripts/setup.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/setup.sh}
    volumes: ["miniodata:/data"]
    ports:
      - "127.0.0.1:9010:9000" # S3 API
      - "127.0.0.1:9011:9001" # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:8026:8025" # web inbox
      - "127.0.0.1:1026:1025" # SMTP

  campushub:
    # Step 01: the MCP server. 2 pods behind the gateway: nothing may live in one pod's memory.
    build: .
    deploy:
      replicas: 2
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ALLOWED_HOSTS: localhost,127.0.0.1,gateway
      DATABASE_URL: postgres://campus_app:${CAMPUS_APP_PASSWORD}@postgres:5432/campus
      OIDC_ISSUER: http://localhost:8090/realms/campus # what tokens say in "iss"
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/campus # how pods reach Keycloak
      RESOURCE_URL: http://localhost:4100/mcp # CampusHub's identity: must be in the token's "aud"
      REDIS_URL: redis://redis:6379
      COMPLETIONS_PER_MINUTE: 60 # autocomplete budget per user (attack C4)
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?run scripts/setup.sh} # the app's own MinIO user, not the admin
      S3_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?run scripts/setup.sh}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: nginx:1.27.5@sha256:6784fb0834aa7dbbe12e3d7471e69c290df3e6ba810dc38b34ae33d3c1c05f7d
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports:
      - "127.0.0.1:4100:80" # public entrance (4000 is InsureBot's)
      - "127.0.0.1:4103:82" # LAB: cache that obeys Cache-Control
      - "127.0.0.1:4104:83" # LAB: broken cache that ignores it (shows C3)
    depends_on:
      campushub:
        condition: service_healthy

volumes:
  pgdata:
  kcdata:
  miniodata:
